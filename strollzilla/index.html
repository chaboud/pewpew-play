<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Strollzilla: Kaiju Country</title>
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0b1020; color: #e9ecf5; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hidden { display: none !important; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(11,16,32,0.92); padding: 24px; text-align: center; }
    #boot h1 { font-size: 22px; letter-spacing: 0.04em; }
    #boot p { color: #9aa3b8; font-size: 13px; max-width: 420px; line-height: 1.5; }
    button { font: inherit; color: #0b1020; background: #ffd23a; border: 0; border-radius: 10px; padding: 14px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #2b3350; color: #e9ecf5; }
    #cities { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #cities button { padding: 8px 14px; font-size: 13px; background: #1b2238; color: #9aa3b8; border: 1px solid #2b3350; }
    #cities button.on { background: #2b3350; color: #ffd23a; border-color: #ffd23a; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; font-size: 13px; line-height: 1.45; text-shadow: 0 1px 2px #000; }
    #hud .big { font-size: 30px; font-weight: 700; color: #ffd23a; }
    #hud .right { text-align: right; }
    #hud button { pointer-events: auto; padding: 6px 10px; font-size: 12px; margin-top: 6px; margin-left: 6px; }
    #hud button.on { background: #ff4d6d; color: #fff; }
    #status { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; color: #9aa3b8; pointer-events: none; }
    #attribution { position: fixed; bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); left: 0; right: 0; text-align: center; font-size: 10px; color: #6f7890; pointer-events: none; }
    #stick { position: fixed; left: 24px; bottom: max(70px, calc(env(safe-area-inset-bottom) + 60px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); touch-action: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,210,58,0.85); pointer-events: none; }
    #stomp { position: fixed; right: 24px; bottom: max(80px, calc(env(safe-area-inset-bottom) + 70px)); width: 110px; height: 110px; border-radius: 50%; font-size: 18px; touch-action: none; }
    #fps { position: fixed; top: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #6f7890; white-space: pre; text-align: center; }
  </style>
  <script type="module" crossorigin src="./assets/index-DiksaLoh.js"></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="boot">
    <h1 id="boot-title">Strollzilla: Kaiju Country</h1>
    <p id="boot-stats">loading the city…</p>
    <p>You are big. The city is real. Walk into things.</p>
    <div id="cities"></div>
    <button id="btn-couch">Couch mode</button>
    <button id="btn-walk" class="secondary">Walk here (your GPS, translated)</button>
    <p>Walk mode maps your real movement onto the chosen city. Screen stays on; a PWA gets no GPS with the screen off.</p>
  </div>
  <div id="hud" class="hidden">
    <div>
      <div class="big" id="hud-score">0</div>
      <div id="hud-cells"></div>
      <div id="hud-chain"></div>
    </div>
    <div class="right">
      <div id="hud-dist">0 m</div>
      <div id="hud-size"></div>
      <button id="btn-cam">camera</button>
      <button id="btn-dbg">DBG</button>
    </div>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <button id="stomp">STOMP</button>
  <div id="fps"></div>
  <div id="attribution"></div>
  <div id="status"></div>
</body>
</html>
