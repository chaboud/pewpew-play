<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kaiju lab</title>
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a2030; color: #e9ecf5; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 8px; }
    select, button, input { font: inherit; }
    #info { position: fixed; bottom: 10px; left: 10px; font-size: 12px; color: #9aa3b8; }
  </style>
  <script type="module" crossorigin src="./assets/kaijulab-xyVX1jGI.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/atmosphere-BxTnw3_9.js">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <label>pose <select id="pose"><option>walk</option><option>stand</option><option>stomp</option><option>roar</option></select></label>
    <label>speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label>res <select id="res"><option>64</option><option selected>96</option><option>128</option></select></label>
    <label><input id="turn" type="checkbox" checked> turntable</label>
    <label><input id="wire" type="checkbox"> wire</label>
    <label><input id="bones" type="checkbox"> bones</label>
    <label>hour <input id="hour" type="range" min="0" max="24" step="0.5" value="15"></label>
  </div>
  <div id="info"></div>
</body>
</html>
