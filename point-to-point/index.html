<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Point-to-point</title>
<style>
  :root { color-scheme: dark; --ink: #f2f0ea; --dim: rgba(242,240,234,.62); --panel: rgba(14,16,20,.72); --line: rgba(242,240,234,.22); --hot: #ff5a3c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1014; color: var(--ink); font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: #0e1014; z-index: 20; padding: 24px; }
  #loading h1 { font-size: 22px; font-weight: 650; letter-spacing: .02em; margin: 0; }
  #loading p { margin: 0; color: var(--dim); max-width: 34ch; }
  #loading .err { color: var(--hot); white-space: pre-wrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #dash { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  #speed { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #speed small { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 4px; }
  #gear { font-size: 15px; font-weight: 650; }
  #rpm { width: 150px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin: 5px auto 0; overflow: hidden; }
  #rpm i { display: block; height: 100%; width: 0; background: var(--ink); }
  #rpm i.red { background: var(--hot); }
  #hurt { font-size: 11px; color: var(--hot); min-height: 14px; margin-top: 3px; }
  #clock { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.7); text-align: center; }
  #clock small { display: block; font-size: 11px; font-weight: 500; color: var(--dim); }
  #bar { z-index: 3; position: absolute; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; gap: 6px; pointer-events: auto; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; min-width: 40px; min-height: 40px; -webkit-tap-highlight-color: transparent; }
  button:active, button.on { background: rgba(242,240,234,.2); }
  #menu { z-index: 3; position: absolute; top: calc(56px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: min(330px, calc(100vw - 16px)); max-height: calc(100vh - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; pointer-events: auto; display: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: pan-y; }
  #menu.open { display: block; }
  #menu h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 10px 2px 6px; font-weight: 600; }
  #menu h2:first-child { margin-top: 2px; }
  #menu .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #menu .starts button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
  #cars button b { display: block; } #cars button small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; }
  #report { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: pre-wrap; margin: 8px 2px 2px; -webkit-user-select: text; user-select: text; }
  #toast { z-index: 3; position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; opacity: 0; transition: opacity .25s; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; }
  #stamp { position: absolute; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); font-size: 10px; color: var(--dim); text-shadow: 0 1px 3px rgba(0,0,0,.8); max-width: 44vw; }
  #mini { position: absolute; left: calc(10px + env(safe-area-inset-left)); top: calc(40px + env(safe-area-inset-top)); width: 132px; height: 132px; border-radius: 50%; pointer-events: auto; box-shadow: 0 2px 12px rgba(0,0,0,.55); }
  /* the big map turns in from the left edge like a page; the pedals stay clear of it, the wheel does not (Q-16) */
  #map { position: absolute; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); bottom: calc(8px + env(safe-area-inset-bottom)); right: calc(212px + env(safe-area-inset-right)); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #171c23; pointer-events: auto; z-index: 2; transform-origin: left center; transform: perspective(1200px) rotateY(-88deg); opacity: 0; visibility: hidden; transition: transform .32s cubic-bezier(.2,.7,.2,1), opacity .2s, visibility 0s .32s; }
  #map.open { transform: perspective(1200px) rotateY(0deg); opacity: 1; visibility: visible; transition: transform .32s cubic-bezier(.2,.7,.2,1), opacity .12s; }
  #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #map-bar { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
  #map-note { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--dim); text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }
  #touch { position: fixed; inset: 0; z-index: 4; display: none; }
  @media (pointer: coarse) { #touch { display: block; } }
  #wheel { position: absolute; left: 0; top: 18%; bottom: 0; width: 50%; }
  #wheel-knob { position: absolute; bottom: 22%; margin-left: -32px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(242,240,234,.75); background: rgba(242,240,234,.14); opacity: 0; pointer-events: none; }
  #wheel-hint { position: absolute; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; }
  .pedal { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); width: 84px; height: 112px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: grid; place-content: center; font-weight: 650; color: var(--dim); }
  .pedal.down { background: rgba(242,240,234,.3); color: var(--ink); }
  #gas { right: calc(12px + env(safe-area-inset-right)); height: 132px; }
  #brake { right: calc(108px + env(safe-area-inset-right)); }
  #seam { position: absolute; right: calc(72px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 60px; text-align: center; font-size: 9px; letter-spacing: .08em; color: var(--dim); pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #hand { right: calc(12px + env(safe-area-inset-right)); bottom: calc(158px + env(safe-area-inset-bottom)); height: 46px; width: 180px; }
</style>
  <script type="module" crossorigin src="./assets/index-DxouYqEd.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<div id="touch">
  <div id="wheel"><div id="wheel-knob"></div><div id="wheel-hint">slide a thumb here to steer</div></div>
  <div class="pedal" id="hand" data-pedal="hand">HANDBRAKE</div>
  <div class="pedal" id="brake" data-pedal="brake">BRAKE</div>
  <div class="pedal" id="gas" data-pedal="gas">GAS</div>
  <div id="seam">◂ BOTH ▸</div>
</div>
<div id="hud">
  <div id="stamp"></div>
  <canvas id="mini" title="Map (N)"></canvas>
  <div id="map"><canvas></canvas>
    <div id="map-bar"><button id="map-in" title="Closer">+</button><button id="map-out" title="Further">−</button><button id="map-clear">no target</button><button id="map-close" title="Back to the road (N)">✕</button></div>
    <div id="map-note">tap a street to set a target · the road does not wait</div>
  </div>
  <div id="clock"><span id="time">0:00.0</span><small id="place"></small></div>
  <div id="dash"><div id="speed">0<small>km/h</small></div><div id="gear">1</div><div id="rpm"><i></i></div><div id="hurt"></div></div>
  <div id="bar">
    <button id="b-restart" title="Restart (R)">↺</button>
    <button id="b-camera" title="Camera (C)">◉</button>
    <button id="b-menu" title="Menu (M)">☰</button>
  </div>
  <div id="menu">
    <h2>Car</h2><div class="starts" id="cars"></div>
    <h2>Start from</h2><div class="starts" id="starts"></div>
    <h2>This run</h2><div class="row"><button id="b-replay">Replay it</button><button id="b-sound" class="on">Sound</button></div>
    <h2>This device</h2><div class="row"><button id="b-check">Check the sim</button><button id="b-frames">Frame times</button></div>
    <div id="report"></div>
  </div>
  <div id="toast"></div>
</div>
<div id="loading"><h1>Point-to-point</h1><p id="loading-step">starting</p><p>driving spike: one car, San Francisco, no race yet</p></div>
</body>
</html>
